<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Uhifadhi">
  <!-- The full masterbrand at every size: knockout U tile with the EMPTY child
       tile in the cut corner — the child never degrades to a chip. The mark
       always renders in the theme's accent green: canvas colours (#3ED9A8 on
       #0C1310) by default, the light theme's deep jade (#0F8A68 on #F3F2EB)
       on a light scheme. -->
  <style>
    .tile { fill: #3ED9A8; }
    .child { fill: #0C1310; }
    .ring { fill: none; stroke: #3ED9A8; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #0F8A68; }
      .child { fill: #F3F2EB; }
      .ring { stroke: #0F8A68; }
    }
  </style>
  <path class="tile" fill-rule="evenodd" d="M18 0H82A18 18 0 0 1 100 18V64L64 100H18A18 18 0 0 1 0 82V18A18 18 0 0 1 18 0ZM23 20V50A27 27 0 0 0 77 50V20H62V50A12 12 0 0 1 38 50V20Z"/>
  <g transform="translate(52,52) scale(0.48)">
    <path class="child" d="M18 0H82A18 18 0 0 1 100 18V64L64 100H18A18 18 0 0 1 0 82V18A18 18 0 0 1 18 0Z"/>
    <path class="ring" d="M18 0H82A18 18 0 0 1 100 18V64L64 100H18A18 18 0 0 1 0 82V18A18 18 0 0 1 18 0Z" stroke-width="11"/>
  </g>
</svg>
