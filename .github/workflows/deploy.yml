name: Deploy uhifadhi

# Build the image on GitHub's amd64 runners and deploy with Kamal.
# Manual dispatch: run "Deploy uhifadhi". First time on a fresh server,
# tick `bootstrap` = true (installs Docker + boots the PostGIS accessory + proxy).
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run on a fresh server (kamal setup instead of deploy)"
        type: boolean
        default: false

concurrency:
  group: deploy-uhifadhi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push the image to ghcr.io via GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Kamal
        run: gem install kamal -v "~> 2.12"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH for the deploy host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host $DEPLOY_HOST
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          # Server + public domain for config/deploy.yml's ERB — kept out of
          # the public repo (the IP would defeat Cloudflare's origin hiding).
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          # New GHCR package linked to this repo — the repo-scoped GITHUB_TOKEN can push it.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Telemetry's own database — same cluster/creds as DATABASE_URL, dbname
          # uhifadhi_telemetry. See config/deploy.yml and .kamal/secrets.example.
          TELEMETRY_DATABASE_URL: ${{ secrets.TELEMETRY_DATABASE_URL }}
          UHIFADHI_GOOGLE_MAPS_API_KEY: ${{ secrets.UHIFADHI_GOOGLE_MAPS_API_KEY }}
          # Composer auth for the image build (BuildKit secret via kamal
          # builder.secrets): private uhifadhilabs packages install from GitHub.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.BUNDLES_TOKEN }}"}}'
          # Cloudflare Origin cert served by kamal-proxy (Full-strict TLS on the CF→origin hop)
          CERTIFICATE_PEM: ${{ secrets.CERTIFICATE_PEM }}
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
        run: |
          # Kamal reads .kamal/secrets (gitignored). Recreate it referencing the env above.
          cat > .kamal/secrets <<'EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          APP_SECRET=$APP_SECRET
          DATABASE_URL=$DATABASE_URL
          TELEMETRY_DATABASE_URL=$TELEMETRY_DATABASE_URL
          UHIFADHI_GOOGLE_MAPS_API_KEY=$UHIFADHI_GOOGLE_MAPS_API_KEY
          COMPOSER_AUTH=$COMPOSER_AUTH
          CERTIFICATE_PEM=$CERTIFICATE_PEM
          PRIVATE_KEY_PEM=$PRIVATE_KEY_PEM
          EOF

          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            echo "First run → kamal setup (bootstrap Docker + accessories + proxy + deploy)"
            kamal setup
          else
            kamal deploy
            # (Re)boot the engine accessory so it picks up the latest uhifadhi-engine image.
            # reboot = stop + remove + boot, so it works whether or not it is already running.
            kamal accessory reboot engine
          fi
