name: Deploy uhifadhi to Hetzner

# Build the image on GitHub's amd64 runners and deploy to Hetzner with Kamal.
# Manual dispatch: run "Deploy uhifadhi to Hetzner". First time on a fresh server,
# tick `bootstrap` = true (installs Docker + boots the PostGIS accessory + proxy).
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run on a fresh server (kamal setup instead of deploy)"
        type: boolean
        default: false

concurrency:
  group: deploy-uhifadhi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push the image to ghcr.io via GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Kamal
        run: gem install kamal -v "~> 2.12"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH for the deploy host
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host 78.47.239.40
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          # New GHCR package linked to this repo — the repo-scoped GITHUB_TOKEN can push it.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Kamal reads .kamal/secrets (gitignored). Recreate it referencing the env above.
          cat > .kamal/secrets <<'EOF'
          KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          APP_SECRET=$APP_SECRET
          DATABASE_URL=$DATABASE_URL
          EOF

          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            echo "First run → kamal setup (bootstrap Docker + accessories + proxy + deploy)"
            kamal setup
          else
            kamal deploy
          fi
