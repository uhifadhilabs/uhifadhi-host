# CLA enforcement — every commit author on every PR must have electronically
# signed CLA.md before the required "CLA" check goes green (BUSINESS model:
# CLA only, no DCO fallback, never negotiated case by case). First-time
# contributors sign by posting the sentence below from their GitHub account;
# the signature is stored on the cla-signatures branch and re-verified on
# every PR and every pushed commit from then on.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # store signatures on the cla-signatures branch
  pull-requests: write   # post/refresh the signing comment + status
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/uhifadhilabs/uhifadhi/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: eemjema,dependabot[bot]
