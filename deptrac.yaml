# Dependency rules — one layer per bounded context (modular monolith), mirroring the
# vivutio convention. A cross-module reach that isn't in a module's allow-list below is
# a build failure, not a convention. Each module's own sublayers (Entity/Service/
# Repository/Domain/Controller/ApiResource/…) are covered by its module layer, so
# intra-module dependencies never need to be spelled out.
#
# Spatial is the shared spatial kernel: every topic domain may use it; it uses nothing but
# itself. Each DNCA topic (Forest now; Settlement/Drainage/Invasives later) is added as
# a sibling layer allowed to depend only on [<Topic>, Spatial].
deptrac:
  paths:
    - src
  exclude_files:
    - '#src/Kernel\.php#'
  layers:
    - name: Foundation
      collectors:
        - { type: classLike, value: 'App\\Foundation\\.*' }
    - name: Access
      collectors:
        - { type: classLike, value: 'App\\Access\\.*' }
    - name: Spatial
      collectors:
        - { type: classLike, value: 'App\\Spatial\\.*' }
    - name: Forest
      collectors:
        - { type: classLike, value: 'App\\Forest\\.*' }
    - name: LandCover
      collectors:
        - { type: classLike, value: 'App\\LandCover\\.*' }
    - name: Vegetation
      collectors:
        - { type: classLike, value: 'App\\Vegetation\\.*' }
    - name: Settlement
      collectors:
        - { type: classLike, value: 'App\\Settlement\\.*' }
    - name: Roads
      collectors:
        - { type: classLike, value: 'App\\Roads\\.*' }
    - name: Wildlife
      collectors:
        - { type: classLike, value: 'App\\Wildlife\\.*' }
    - name: Structure
      collectors:
        - { type: classLike, value: 'App\\Structure\\.*' }
    - name: Statistics
      collectors:
        - { type: classLike, value: 'App\\Statistics\\.*' }
    - name: Ingestion
      collectors:
        - { type: classLike, value: 'App\\Ingestion\\.*' }
    - name: Composition
      collectors:
        - { type: classLike, value: 'App\\Composition\\.*' }
    - name: Dashboard
      collectors:
        - { type: classLike, value: 'App\\Dashboard\\.*' }
  ruleset:
    # Cross-cutting entity concerns (UUID/timestamps). Seen by all, sees none.
    Foundation: [Foundation]
    # Authentication + position/permission authorization. Uses Foundation only;
    # the Dashboard UI layer may depend on it (for #[IsGranted] + the current user).
    Access: [Access, Foundation]
    # Shared spatial kernel — depends only on itself + Foundation.
    Spatial: [Spatial, Foundation]
    # Topic 6 (Deforestation) — uses the Spatial kernel + the generic Ingestion store (its
    # forest_loss_year series lives there; the engine writes it).
    Forest: [Forest, Spatial, Ingestion, Foundation]
    # Topic: land cover (WorldCover composition/fragmentation) — a thin context holding its
    # ModuleDefinition; data rides the generic Ingestion store.
    LandCover: [LandCover, Spatial, Foundation]
    # Topic: vegetation (MODIS NDVI phenology + peak greenness) — a thin context holding its
    # ModuleDefinition; data rides the generic Ingestion store (series + raster).
    Vegetation: [Vegetation, Spatial, Foundation]
    # Topic: settlement (GHSL built-up expansion, in vs ring) — a thin context holding its
    # ModuleDefinition; data rides the generic Ingestion store (series + vector growth map).
    Settlement: [Settlement, Spatial, Foundation]
    # Topic: roads (OSM network, class lengths, remoteness) — a thin context holding its
    # ModuleDefinition; data rides the generic Ingestion store (tables + vector + raster).
    Roads: [Roads, Spatial, Foundation]
    # Topic: wildlife (GBIF SDM — suitability, drivers, AUC) — a thin context holding its
    # ModuleDefinition; data rides the generic Ingestion store (tables + rasters).
    Wildlife: [Wildlife, Spatial, Foundation]
    # Topic: statistics (Q6 synthesis) — NO engine module: derives its dataframes from the
    # generic Ingestion store (all modules' data) + the tagged definitions' captions.
    # Topic: structure (CCI biomass x GLAD height agreement) — a thin context holding its
    # ModuleDefinition; data rides the generic Ingestion store (tables + rasters).
    Structure: [Structure, Spatial, Foundation]
    Statistics: [Statistics, Spatial, Ingestion, Foundation]
    # Data ingestion — the generic per-module store + engine pipeline. Reads AOIs (Spatial);
    # knows NO topic (topics read from it, never the other way around).
    Ingestion: [Ingestion, Spatial, Foundation]
    # How an area's sub-app is composed — module catalogue, per-area activation, and
    # visualization config. Uses the Spatial kernel (areas) + Foundation.
    Composition: [Composition, Spatial, Foundation]
    # UI composition layer — the only place allowed to see everything; nothing
    # depends on it.
    Dashboard: [Dashboard, Spatial, Forest, LandCover, Vegetation, Settlement, Roads, Wildlife, Structure, Statistics, Ingestion, Composition, Access, Foundation]
