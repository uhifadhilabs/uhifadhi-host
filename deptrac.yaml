# Dependency rules — one layer per bounded context (modular monolith), mirroring the
# vivutio convention. A cross-module reach that isn't in a module's allow-list below is
# a build failure, not a convention. Each module's own sublayers (Entity/Service/
# Repository/Domain/Controller/ApiResource/…) are covered by its module layer, so
# intra-module dependencies never need to be spelled out.
#
# Spatial is the shared spatial kernel: every topic domain may use it; it uses nothing but
# itself. Each DNCA topic (Forest now; Settlement/Drainage/Invasives later) is added as
# a sibling layer allowed to depend only on [<Topic>, Spatial].
deptrac:
  paths:
    - src
  exclude_files:
    - '#src/Kernel\.php#'
  layers:
    - name: Foundation
      collectors:
        - { type: classLike, value: 'App\\Foundation\\.*' }
    - name: Access
      collectors:
        - { type: classLike, value: 'App\\Access\\.*' }
    - name: Spatial
      collectors:
        - { type: classLike, value: 'App\\Spatial\\.*' }
    - name: Forest
      collectors:
        - { type: classLike, value: 'App\\Forest\\.*' }
    - name: Ingestion
      collectors:
        - { type: classLike, value: 'App\\Ingestion\\.*' }
    - name: Dashboard
      collectors:
        - { type: classLike, value: 'App\\Dashboard\\.*' }
  ruleset:
    # Cross-cutting entity concerns (UUID/timestamps). Seen by all, sees none.
    Foundation: [Foundation]
    # Authentication + position/permission authorization. Uses Foundation only;
    # the Dashboard UI layer may depend on it (for #[IsGranted] + the current user).
    Access: [Access, Foundation]
    # Shared spatial kernel — depends only on itself + Foundation.
    Spatial: [Spatial, Foundation]
    # Topic 6 (Deforestation) — isolated; may use the Spatial kernel only.
    Forest: [Forest, Spatial, Foundation]
    # Data ingestion — reads AOIs (Spatial) and fills topic tables (Forest);
    # topics never depend back on Ingestion.
    Ingestion: [Ingestion, Spatial, Forest, Foundation]
    # UI composition layer — the only place allowed to see everything; nothing
    # depends on it.
    Dashboard: [Dashboard, Spatial, Forest, Ingestion, Access, Foundation]
