doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Hide GDAL/OGR bookkeeping (ogr_system_tables — legacy of pre-ORM loads)
        # from migrations:diff / schema:validate. The pipeline no longer creates
        # it (staging is a Doctrine entity now); this is cheap insurance.
        schema_filter: '~^(?!ogr_)~'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            # One mapping per bounded context — entities live under src/<Module>/Entity,
            # not a shared src/Entity. Add a block per new topic module.
            Access:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Access/Entity'
                prefix: 'Uhifadhi\Access\Entity'
                alias: Access
            Spatial:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Spatial/Entity'
                prefix: 'Uhifadhi\Spatial\Entity'
                alias: Spatial
            Forest:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Forest/Entity'
                prefix: 'Uhifadhi\Forest\Entity'
                alias: Forest
            Ingestion:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ingestion/Entity'
                prefix: 'Uhifadhi\Ingestion\Entity'
                alias: Ingestion
            Composition:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Composition/Entity'
                prefix: 'Uhifadhi\Composition\Entity'
                alias: Composition

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
