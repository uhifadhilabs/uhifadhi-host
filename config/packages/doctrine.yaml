doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Hide non-Doctrine tables from migrations:diff / schema:validate:
        #  - ogr_*      GDAL/OGR bookkeeping (ogr_system_tables, created by ogr2ogr)
        #  - ingest_*   transient staging tables written by ingestion pipelines
        schema_filter: '~^(?!ogr_|ingest_)~'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            # One mapping per bounded context — entities live under src/<Module>/Entity,
            # not a shared src/Entity. Add a block per new topic module.
            Spatial:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Spatial/Entity'
                prefix: 'App\Spatial\Entity'
                alias: Spatial
            Forest:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Forest/Entity'
                prefix: 'App\Forest\Entity'
                alias: Forest
            Ingestion:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ingestion/Entity'
                prefix: 'App\Ingestion\Entity'
                alias: Ingestion

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
