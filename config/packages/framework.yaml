# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # The geoprocessing engine (separate container). Injected as `HttpClientInterface $engineClient`.
    http_client:
        scoped_clients:
            engine.client:
                base_uri: '%env(ENGINE_BASE_URI)%'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
