security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # The single authority's staff accounts, looked up by email.
    providers:
        app_user_provider:
            entity:
                class: Uhifadhi\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Sign-in for the field app. Firewall-free on purpose: a phone whose
        # token has expired still holds it and still sends it, and that stale
        # header must never be what stops a ranger signing in again. The
        # endpoint checks the credentials itself.
        api_auth:
            pattern: ^/api/auth/token$
            security: false

        # The machine API: bearer tokens, no session, no form login, no
        # remember-me. Stateless is not an optimisation here — the app syncs in
        # bursts of hundreds of requests from a truck, and a session per burst
        # would be a lie about a conversation that is not happening.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - Uhifadhi\Security\ApiTokenAuthenticator
            # Makes "no token at all" a 401 rather than a 403: the app shows
            # different things for the two, so the difference has to be real.
            entry_point: Uhifadhi\Security\ApiTokenAuthenticator

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: dashboard_index

            # Blunt the credential-stuffing surface (max 5 attempts / minute / IP).
            login_throttling:
                max_attempts: 5

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week
                always_remember_me: false

            # Super Admin impersonation — guarded by ROLE_ALLOWED_TO_SWITCH.
            switch_user: true

            logout:
                path: app_logout
                target: app_login

    # Managing tiers hold the umbrella capability roles; Super Admin also switches users.
    # Capability leaves (ROLE_AREAS/…) are granted directly to Staff via their position —
    # this ladder only elevates the tiers, it is not a permission tree.
    role_hierarchy:
        # Manager grants NO umbrellas by tier — a Manager's capabilities come from their
        # Position (position-driven, like Staff). Admin+ hold everything.
        ROLE_ADMIN: [ROLE_MANAGER, ROLE_AREAS, ROLE_INGESTION, ROLE_MODULES]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    # Only the *first* matching rule applies.
    access_control:
        - { path: ^/up$, roles: PUBLIC_ACCESS } # Kamal liveness — DB-free, pre-auth
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # The OpenAPI document and its UIs — dev only (api_platform.yaml turns
        # them off in prod, so in production these paths simply do not exist).
        - { path: '^/api/docs', roles: PUBLIC_ACCESS }
        - { path: '^/api/\.well-known', roles: PUBLIC_ACCESS }
        - { path: '^/api$', roles: PUBLIC_ACCESS }
        # Everything else under /api needs a valid token. Per-endpoint
        # permissions (e.g. patrols.record) are checked by the modules that own
        # those endpoints — the host does not know what they are.
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/team, roles: ROLE_MANAGER } # team administration is manager-level and up
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
