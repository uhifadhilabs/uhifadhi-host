# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Uhifadhi\:
        resource: '../src/'
        # Telemetry wires itself (config/packages/telemetry.yaml): it owns a second
        # DBAL connection and a per-environment sink, neither of which autowiring can
        # pick. Keeping it out of the blanket also keeps it self-contained — the day
        # it becomes uhifadhilabs/telemetry-module, this exclude and that file leave
        # together and nothing else here has to change.
        exclude:
            - '../src/Telemetry/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # THE SEAM'S SERVICES, NAMED FOR AUTOWIRING. A reusable bundle's services
    # are private and prefixed with its alias (that is the bundle best practice,
    # and uhifadhi/seam-module follows it), so nothing in src/ can be given one
    # by type without an alias here. These are the ones this application reads;
    # everything else the seam owns, it owns alone.
    Uhifadhi\Seam\Service\ModuleCatalogue: '@seam.catalogue'
    Uhifadhi\Seam\Service\AreaModuleService: '@seam.area_modules'
    Uhifadhi\Seam\Service\AreaModuleLedger: '@seam.area_module_ledger'
    Uhifadhi\Seam\Service\ModuleEntryRouteResolver: '@seam.entry_routes'
    Uhifadhi\Seam\Service\ModulePermissionCatalogue: '@seam.permissions'

    # THE SHELL'S SEAMS, FILLED BY THIS APPLICATION. The shell owns the nav's
    # shape and the tab strip's shape; what goes in them needs the areas, the
    # viewer, the permission voters and the module seam's ledger, so it is
    # composed here and handed over as value objects.
    #
    # The tag is written by hand because a reusable bundle's services are not
    # autoconfigured — which is the same reason the seam's ids are aliased above.
    Uhifadhi\Navigation\HostNavigation:
        tags: ['shell.nav_section']

    # An ALIAS, not a tag: two things claiming to know which area you are in is
    # exactly the disagreement the shell refuses to arbitrate.
    shell.area_shell_source: '@Uhifadhi\Navigation\AreaShellSource'
